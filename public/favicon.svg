<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shield-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050D1A"/>
    </linearGradient>
    <linearGradient id="a-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C8D8"/>
      <stop offset="100%" stop-color="#00A2B6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M32 3L6 13v18c0 14.4 11.1 27.8 26 31 14.9-3.2 26-16.6 26-31V13L32 3z"
    fill="url(#shield-bg)"
    stroke="#00A2B6"
    stroke-width="1.5"
    stroke-linejoin="round"/>

  <!-- Cyan top-edge highlight -->
  <path d="M32 3L6 13v2l26-9.5L58 15v-2L32 3z"
    fill="#00C8D8"
    opacity="0.25"/>

  <!-- "A" mark -->
  <g filter="url(#glow)">
    <path d="M32 14l-12 28h5.5l2.8-7h7.4l2.8 7H44L32 14zm0 7.5l2.6 9.5h-5.2l2.6-9.5z"
      fill="url(#a-grad)"/>
  </g>
</svg>
